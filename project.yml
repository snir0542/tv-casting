name: TVMirror
options:
  bundleIdPrefix: com.tvmirror
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TVMirror:
    type: application
    platform: iOS
    sources: [App, Shared]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tvmirror.app
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: TV Mirror
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: "Needed to send your screen to the TV"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    dependencies:
      - target: TVMirrorBroadcast
        embed: true
  TVMirrorBroadcast:
    type: app-extension
    platform: iOS
    # Core = the platform-independent part, also built as the MirrorCore package for `swift test`.
    # Broadcast/player.html is copied as a resource (the page the TV browser loads).
    sources:
      - path: Broadcast
        excludes: ["player.html"]
      - Shared
      - Core
      - path: Broadcast/player.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tvmirror.app.broadcast
    info:
      path: Generated/Broadcast-Info.plist
      properties:
        CFBundleDisplayName: TV Mirror
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "Needed to send your screen to the TV"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
